services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahelys
      POSTGRES_PASSWORD: sahelys
      POSTGRES_DB: sahelys_db
    ports:
      - "5432:5432"
    volumes:
      - sahelys_postgres_data:/var/lib/postgresql/data

volumes:
  sahelys_postgres_data:
